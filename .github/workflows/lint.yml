name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'

#      - name: Setup Bun
#        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Dependencies
        env:
          COMPOSER_AUTH: '{"http-basic":{"packages.filamentphp.com":{"username":"${{ secrets.FILAMENT_BLUEPRINT_EMAIL }}","password":"${{ secrets.FILAMENT_BLUEPRINT_LICENSE_KEY }}"}}}'
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
#          bun install

      - name: Run Pint
        run: vendor/bin/pint

      - name: Run Mago lint
        run: vendor/bin/mago lint --reporting-format=github

      - name: Run Larastan
        run: vendor/bin/phpstan analyse --memory-limit=2G --error-format=github --no-progress

      # - name: Commit Changes
