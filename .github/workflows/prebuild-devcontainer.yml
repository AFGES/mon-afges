name: Prebuild Dev Container

on:
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - main
    paths:
      - '.devcontainer/**'
      - 'docker/**'      # Trigger if you change the Dockerfile
      - 'compose.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Prebuild Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          # Point to your devcontainer folder
          subFolder: .

          # The name of the image to push (matches the one in compose.yml, must be lowercase)
          imageName: ghcr.io/afges/mon-afges/sail

          # Cache usually speeds up re-builds
          cacheFrom: ghcr.io/afges/mon-afges/sail

          # Always push the result to the registry
          push: always

          # Important: Since Sail uses docker-compose, we don't just build a Dockerfile.
          # The action automatically detects devcontainer.json -> docker-compose.yml
