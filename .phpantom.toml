#:schema https://github.com/PHPantom-dev/phpantom_lsp/raw/main/config-schema.json

# PHPantom LSP: https://phpantom-dev.github.io/phpantom_lsp/configuration/
# Only non-default values are set here. Everything else is auto-detected:
# PHP 8.4 from composer.json, Pint from require-dev, PHPStan + Larastan from vendor/bin,
# Mago lint from the [linter] table in mago.toml, and migrations from database/migrations.

[diagnostics]
downgrade-nullable-argument-mismatch = true

[indexing]
# Gitignored IDE helper files are indexed only if someone generates them.
include = ["_ide_helper.php", "_ide_helper_models.php", ".phpstorm.meta.php"]

[phpstan]
memory-limit = "2G"
