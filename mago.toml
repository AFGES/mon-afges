php-version = "8.4"

[source]
paths = ["app", "config", "database", "routes", "tests"]

[linter]
integrations = ["laravel", "pest"]
baseline = "mago-lint-baseline.toml"

[linter.rules]
# Conflicts with Laravel and Pest conventions.
prefer-static-closure = { enabled = false }
literal-named-argument = { enabled = false }
function-name = { enabled = false }
no-empty = { enabled = false }
# False positives on the `'password' => 'hashed'` cast and test fixtures.
no-literal-password = { enabled = false }
# Size metrics flag models, policies and Filament resources by design.
too-many-methods = { enabled = false }
cyclomatic-complexity = { enabled = false }
kan-defect = { enabled = false }
halstead = { enabled = false }
